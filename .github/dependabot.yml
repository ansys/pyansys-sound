version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # Fallback cooldown if no specific rule applies
    labels:
      - "maintenance"
      - "dependencies"
    commit-message:
      prefix: "build"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # semver-* options are not applicable for GitHub Actions
      exclude:
        - "ansys/actions/*"
    labels:
      - "maintenance"
    commit-message:
      prefix: "ci"
    groups:
       actions:
          patterns:
            - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "ansys/pre-commit-hooks/*"
    labels:
      - "maintenance"
    commit-message:
      prefix: "chore"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    assignees:
      - "ansaminard"
      - "anssmolla"
